<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackPack — 장비 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 좌측 슬림 사이드바 (Claude 앱 스타일 네비게이션) -->
    <aside class="nav">
      <div class="nav-brand">
        <span class="nav-mark">🏕️</span>
        <span class="nav-title">PackPack</span>
      </div>

      <button id="newPackBtn" class="nav-new-btn">
        <span class="plus">+</span> 새 팩
      </button>

      <button id="showInventoryBtn" class="nav-item nav-item--inventory">
        <span class="nav-icon">🎒</span>
        마스터 리스트
        <span id="gearCountBadge" class="nav-badge">0</span>
      </button>

      <div class="nav-section-label">내 팩</div>
      <ul id="packList" class="nav-pack-list"></ul>

      <div class="nav-footer">
        <span id="rateDisplay" class="nav-rate">환율 로딩 중...</span>
        <button id="resetDataBtn" class="nav-reset" title="모든 데이터 초기화">초기화</button>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="main">
      <!-- 시작 화면 -->
      <section id="welcomeView" class="view welcome-view">
        <div class="welcome-card">
          <span class="welcome-mark">🏕️</span>
          <h1>그램 단위로 여행을 준비하세요</h1>
          <p>먼저 <strong>마스터 리스트</strong>에 소유한 장비를 등록하고, 여행마다 <strong>팩</strong>을 만들어 필요한 장비를 끌어다 놓으세요.</p>
          <div class="welcome-actions">
            <button id="welcomeAddGearBtn" class="btn primary">장비 등록하기</button>
            <button id="welcomeNewPackBtn" class="btn secondary">새 팩 만들기</button>
          </div>
        </div>
      </section>

      <!-- 마스터 리스트 전용 화면 (팩 미선택) -->
      <section id="inventoryView" class="view inventory-view" hidden>
        <header class="view-header">
          <div>
            <h1>마스터 리스트</h1>
            <p class="view-subtitle">소유한 모든 장비. 팩을 만들면 여기서 끌어다 놓을 수 있어요.</p>
          </div>
          <button id="addGearBtnMain" class="btn primary">+ 장비 추가</button>
        </header>
        <input id="inventorySearch" class="search-input" type="search" placeholder="장비 검색..." />
        <div id="inventoryGrid" class="inventory-grid"></div>
      </section>

      <!-- 팩 상세 화면 (분할 뷰: 마스터 리스트 | 팩) -->
      <section id="packView" class="view pack-view" hidden>
        <header class="view-header">
          <div class="pack-title-group">
            <h1 id="packName" contenteditable="true" spellcheck="false"></h1>
            <p class="view-subtitle">왼쪽 장비를 오른쪽으로 끌어다 놓으세요</p>
          </div>
          <div class="pack-actions">
            <button id="addGearBtnPack" class="btn-icon" title="새 장비 등록">+ 장비</button>
            <button id="deletePackBtn" class="btn-icon danger" title="팩 삭제">삭제</button>
          </div>
        </header>

        <section class="pack-summary">
          <div class="chart-container">
            <canvas id="categoryChart"></canvas>
          </div>
          <div class="summary-stats">
            <div class="stat">
              <span class="label">총 무게</span>
              <span id="totalWeight" class="value">0 g</span>
            </div>
            <div class="stat">
              <span class="label">총 가격</span>
              <span id="totalPrice" class="value">₩0</span>
            </div>
            <div class="stat">
              <span class="label">장비 수</span>
              <span id="itemCount" class="value">0</span>
            </div>
          </div>
        </section>

        <div class="split">
          <!-- 왼쪽: 드래그 소스 (마스터 리스트) -->
          <div class="split-pane split-pane--source">
            <h2>내 장비<span id="sourceCountBadge" class="nav-badge"></span></h2>
            <input id="sourceSearch" class="search-input search-input--small" type="search" placeholder="검색..." />
            <div id="sourceList" class="source-list"></div>
          </div>

          <!-- 오른쪽: 드롭 타겟 (팩 내용물) -->
          <div class="split-pane split-pane--target">
            <h2>이 팩의 장비</h2>
            <div id="dropZone" class="drop-zone">
              <div id="dropZoneEmpty" class="drop-zone-empty">왼쪽에서 장비를 끌어다 놓으세요</div>
              <div id="categoryTables"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 장비 추가 모달 -->
      <div id="addGearModal" class="modal" hidden>
        <div class="modal-content">
          <header class="modal-header">
            <h2>장비 추가</h2>
            <button id="closeModalBtn" class="close-btn">✕</button>
          </header>
          <form id="addGearForm">
            <div class="form-row">
              <label for="linkInput">제품 링크</label>
              <div class="input-group">
                <input type="url" id="linkInput" placeholder="https://..." />
                <button type="button" id="autoFillBtn" class="btn-small">자동 채우기</button>
              </div>
            </div>
            <p id="autoFillHint" class="hint"></p>

            <div class="form-row">
              <label for="nameInput">제품명 *</label>
              <input type="text" id="nameInput" required placeholder="예: Zpacks Duplex" />
            </div>

            <div class="form-grid">
              <div class="form-row">
                <label for="categoryInput">카테고리</label>
                <select id="categoryInput">
                  <option value="쉘터">쉘터</option>
                  <option value="침낭">침낭</option>
                  <option value="매트">매트</option>
                  <option value="의류">의류</option>
                  <option value="신발">신발</option>
                  <option value="전자기기">전자기기</option>
                  <option value="조리">조리</option>
                  <option value="기타" selected>기타</option>
                </select>
              </div>
              <div class="form-row">
                <label for="weightInput">무게 (g) *</label>
                <input type="number" id="weightInput" required min="0" step="1" placeholder="505" />
              </div>
              <div class="form-row">
                <label for="priceInput">가격 (₩) *</label>
                <input type="number" id="priceInput" required min="0" step="1" placeholder="999770" />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn primary">추가</button>
              <button type="button" id="cancelBtn" class="btn secondary">취소</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Chart.js for donut chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
