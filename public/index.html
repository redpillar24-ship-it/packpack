<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackPack — 장비 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 좌측 사이드바: 리스트 관리 -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>PackPack</h1>
        <p class="tagline">그램 단위로 여행을 준비한다</p>
      </header>

      <section class="sidebar-section">
        <h2>
          마스터 리스트
          <span id="gearCountBadge" class="badge">0</span>
        </h2>
        <div class="sidebar-actions">
          <button id="addGearBtn" class="btn-small primary">+ 장비 추가</button>
          <button id="searchGearBtn" class="btn-small">🔍 검색</button>
        </div>
        <ul id="gearList" class="gear-master-list"></ul>
      </section>

      <section class="sidebar-section">
        <h2>
          내 팩
          <span id="packCountBadge" class="badge">0</span>
        </h2>
        <button id="newPackBtn" class="btn-small primary">+ 새 팩</button>
        <ul id="packList" class="pack-list"></ul>
      </section>

      <footer class="sidebar-footer">
        <p class="rate-info">
          기준환율<br />
          <span id="rateDisplay">로딩 중...</span>
        </p>
      </footer>
    </aside>

    <!-- 중앙 메인: 팩 상세 / 추가 폼 -->
    <main class="main-content">
      <!-- 팩이 선택되지 않았을 때 -->
      <section id="emptyState" class="empty-state">
        <h2>팩을 선택해주세요</h2>
        <p>좌측에서 기존 팩을 선택하거나 새 팩을 만들어보세요.</p>
      </section>

      <!-- 팩 상세 화면 (선택되었을 때) -->
      <section id="packDetail" class="pack-detail" hidden>
        <header class="pack-header">
          <h2 id="packName"></h2>
          <div class="pack-actions">
            <button id="shareBtn" class="btn-small">📤 공유</button>
            <button id="settingsBtn" class="btn-small">⚙️ 설정</button>
            <button id="deletePackBtn" class="btn-small danger">🗑️ 삭제</button>
          </div>
        </header>

        <!-- 도넛 차트 + 통계 -->
        <section class="pack-summary">
          <div class="chart-container">
            <canvas id="categoryChart"></canvas>
          </div>
          <div class="summary-stats">
            <div class="stat">
              <span class="label">총 무게</span>
              <span id="totalWeight" class="value">0 g</span>
            </div>
            <div class="stat">
              <span class="label">총 가격</span>
              <span id="totalPrice" class="value">₩0</span>
            </div>
            <div class="stat">
              <span class="label">장비 수</span>
              <span id="itemCount" class="value">0</span>
            </div>
          </div>
        </section>

        <!-- 카테고리별 테이블 -->
        <section class="pack-items">
          <div id="categoryTables"></div>
        </section>
      </section>

      <!-- 장비 추가 모달 -->
      <div id="addGearModal" class="modal" hidden>
        <div class="modal-content">
          <header class="modal-header">
            <h2>장비 추가</h2>
            <button id="closeModalBtn" class="close-btn">✕</button>
          </header>
          <form id="addGearForm">
            <div class="form-row">
              <label for="linkInput">제품 링크</label>
              <div class="input-group">
                <input type="url" id="linkInput" placeholder="https://..." />
                <button type="button" id="autoFillBtn" class="btn-small">자동 채우기</button>
              </div>
            </div>
            <p id="autoFillHint" class="hint"></p>

            <div class="form-row">
              <label for="nameInput">제품명 *</label>
              <input type="text" id="nameInput" required placeholder="예: Zpacks Duplex" />
            </div>

            <div class="form-grid">
              <div class="form-row">
                <label for="categoryInput">카테고리</label>
                <select id="categoryInput">
                  <option value="쉘터">쉘터</option>
                  <option value="침낭">침낭</option>
                  <option value="매트">매트</option>
                  <option value="의류">의류</option>
                  <option value="신발">신발</option>
                  <option value="전자기기">전자기기</option>
                  <option value="조리">조리</option>
                  <option value="기타" selected>기타</option>
                </select>
              </div>
              <div class="form-row">
                <label for="weightInput">무게 (g) *</label>
                <input type="number" id="weightInput" required min="0" step="1" placeholder="505" />
              </div>
              <div class="form-row">
                <label for="priceInput">가격 (₩) *</label>
                <input type="number" id="priceInput" required min="0" step="100" placeholder="999770" />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn primary">추가</button>
              <button type="button" id="cancelBtn" class="btn secondary">취소</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Chart.js for donut chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
