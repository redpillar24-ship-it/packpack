<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏕️ PackPack - 캠핑 장비 관리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>🏕️ PackPack</h1>
            <p class="subtitle">Pack with purpose, Travel with confidence</p>
        </header>

        <!-- 통계 영역 -->
        <section class="stats">
            <div class="stat-item">
                <div class="stat-label">총 무게</div>
                <div class="stat-value" id="totalWeight">0 kg</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">총 가격</div>
                <div class="stat-value" id="totalPrice">$0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">총 품목</div>
                <div class="stat-value" id="totalItems">0</div>
            </div>
        </section>

        <!-- 입력 폼 -->
        <section class="form-section">
            <h2>📝 새 장비 추가</h2>
            <form id="gearForm">
                <div class="form-group">
                    <label for="productName">제품명 *</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="예: Salomon XT-6"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">카테고리 *</label>
                        <select id="category" required>
                            <option value="">선택하세요</option>
                            <option value="쉘터">🏕️ 쉘터</option>
                            <option value="의류">👕 의류</option>
                            <option value="배낭">🎒 배낭</option>
                            <option value="취사도구">🍳 취사도구</option>
                            <option value="침구류">🛏️ 침구류</option>
                            <option value="조명">💡 조명</option>
                            <option value="기타">🧸 기타</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantity">수량</label>
                        <input
                            type="number"
                            id="quantity"
                            value="1"
                            min="1"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">무게 (g) *</label>
                        <input
                            type="number"
                            id="weight"
                            placeholder="0"
                            required
                            min="0"
                        >
                    </div>

                    <div class="form-group">
                        <label for="price">가격 ($) *</label>
                        <input
                            type="number"
                            id="price"
                            placeholder="0.00"
                            required
                            min="0"
                            step="0.01"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">설명</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="선택사항: 상품 설명 또는 메모"
                    >
                </div>

                <div class="form-group">
                    <label for="image">이미지</label>
                    <input
                        type="file"
                        id="image"
                        accept="image/*"
                    >
                </div>

                <button type="submit" class="btn btn-primary">➕ 추가</button>
            </form>
        </section>

        <!-- 필터 영역 -->
        <section class="filter-section">
            <h2>🔍 카테고리 필터</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">전체</button>
                <button class="filter-btn" data-category="쉘터">🏕️ 쉘터</button>
                <button class="filter-btn" data-category="의류">👕 의류</button>
                <button class="filter-btn" data-category="배낭">🎒 배낭</button>
                <button class="filter-btn" data-category="취사도구">🍳 취사도구</button>
                <button class="filter-btn" data-category="침구류">🛏️ 침구류</button>
                <button class="filter-btn" data-category="조명">💡 조명</button>
                <button class="filter-btn" data-category="기타">🧸 기타</button>
            </div>
        </section>

        <!-- 리스트 영역 -->
        <section class="list-section">
            <h2>📋 장비 리스트</h2>
            <div id="gearList" class="gear-list">
                <div class="empty-state">
                    <p>아직 추가된 장비가 없습니다. 첫 번째 장비를 추가해보세요! 🚀</p>
                </div>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>Made with ❤️ for lightweight travelers</p>
            <p class="footer-date" id="lastUpdated"></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
